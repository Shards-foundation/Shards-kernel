name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Verify release candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine pip-audit bandit

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from kernels._version import __version__

          expected = f"v{__version__}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match package version {expected!r}")
          print(f"Verified release version: {__version__}")
          PY

      - name: Ruff lint
        run: ruff check . --select E,F --ignore E501

      - name: Run tests with coverage
        run: >
          pytest
          --cov=kernels
          --cov=implementations
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=70

      - name: Enforce governance branch coverage
        run: python scripts/ci/check_governance_coverage.py coverage.json

      - name: Run smoke checks and demos
        run: |
          ./scripts/smoke.sh
          python examples/01_minimal_request.py
          python examples/02_verify_evidence.py
          python examples/03_fail_closed_ambiguity.py
          python examples/04_sqlite_persistent_ledger.py

      - name: Audit dependencies
        run: pip-audit

      - name: Scan Python source
        run: bandit -r kernels implementations -ll

      - name: Build distributions
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          wheel_venv="$RUNNER_TEMP/kernels-release-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          "$wheel_venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_venv/bin/python" -c "import kernels; from kernels.api import StrictKernel; from implementations.storage import SQLiteAuditStorage; print('Release wheel imports: OK')"
          "$wheel_venv/bin/kernels" --help

      - name: Upload verified release distributions
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish verified distributions to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: verified-release-dist
          path: dist/

      - name: Verify downloaded metadata
        run: |
          python -m pip install --upgrade pip
          pip install twine
          twine check dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
