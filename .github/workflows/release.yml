name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine pip-audit bandit

      - name: Ruff lint
        run: ruff check . --select E,F --ignore E501

      - name: Run tests with coverage
        run: >
          pytest
          --cov=kernels
          --cov=implementations
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=70

      - name: Enforce governance branch coverage
        run: python scripts/ci/check_governance_coverage.py coverage.json

      - name: Run smoke checks and demos
        run: |
          ./scripts/smoke.sh
          python examples/01_minimal_request.py
          python examples/02_verify_evidence.py
          python examples/03_fail_closed_ambiguity.py
          python examples/04_sqlite_persistent_ledger.py

      - name: Audit dependencies
        run: pip-audit

      - name: Scan Python source
        run: bandit -r kernels implementations -ll

      - name: Build distributions
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          wheel_venv="$RUNNER_TEMP/kernels-release-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          "$wheel_venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_venv/bin/python" -c "import kernels; from kernels.api import StrictKernel; from implementations.storage import SQLiteAuditStorage; print('Release wheel imports: OK')"
          "$wheel_venv/bin/kernels" --help

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
