name: Dependency Canary

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

jobs:
  canary:
    name: Canary against latest tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package and latest tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --upgrade --upgrade-strategy eager pytest ruff mypy build

      - name: Canary quality checks
        run: |
          # Same honest gate as CI. Repo-wide format/type debt is not a canary signal.
          ruff check . --select E,F --ignore E501
          pytest -q

      - name: Canary build
        run: python -m build
