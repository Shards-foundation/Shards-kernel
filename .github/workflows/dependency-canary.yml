name: Dependency Canary

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:
  # Exercise the canary itself when its workflow changes, before merge.
  pull_request:
    paths:
      - ".github/workflows/dependency-canary.yml"

permissions:
  contents: read

jobs:
  canary:
    name: Canary against latest tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package and latest tooling
        run: |
          python -m pip install --upgrade pip
          # Exercise the same optional test paths as CI (crypto, property tests,
          # HTTP adapters and MCP). The bare package intentionally has no
          # runtime dependencies and cannot run the complete test suite.
          python -m pip install -e ".[dev,crypto,mcp]"
          python -m pip install --upgrade --upgrade-strategy eager pytest ruff mypy build

      - name: Canary quality checks
        run: |
          # Same honest lint gate as CI. Repo-wide format/type debt is not a canary signal.
          ruff --version
          ruff check . --select E,F --ignore E501
          # The normal CI job enforces the pinned Ruff version; this canary
          # intentionally upgrades Ruff to detect compatibility regressions.
          # Deselect only the exact-version contract, not functional tests.
          pytest -q --deselect=tests/test_dev_ruff_version_contract.py::test_installed_ruff_matches_project_dev_pin

      - name: Canary build
        run: python -m build
