name: Publish verified release to PyPI

# Matches the pending PyPI trusted publisher:
# Shards-foundation / Shards-kernel / publish.yml / environment pypi.
# Only dispatch from the exact immutable, published vX.Y.Z tag.
# The tag must be a protected-main ancestor and the release assets must match.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing, published GitHub release tag (for example v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string
      verified_run_id:
        description: "Source workflow run ID; verified independently by the publisher for v0.1.3"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify published GitHub release distributions
    if: >-
      github.repository == 'Shards-foundation/Shards-kernel' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == format('refs/tags/{0}', inputs.release_tag)) ||
        (github.event_name == 'release' && github.event.release.prerelease == false)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only final semantic-version tags (vX.Y.Z) may be published" >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || {
            echo "Publisher must execute at the immutable release tag" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" || {
            echo "Publisher checkout differs from release tag commit" >&2
            exit 1
          }
          # Inputs are *only* selectors, never authority. Independently verify
          # the GitHub API run record, its protected-main SHA, workflow path,
          # and both completed gate jobs before accepting v0.1.3 artifacts.
          if [ "$RELEASE_TAG" = "v0.1.3" ]; then
            [[ "$GITHUB_EVENT_NAME" = "workflow_dispatch" && "$VERIFIED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "v0.1.3 requires a trusted verification run selector" >&2
              exit 1
            }
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" \
              > "$RUNNER_TEMP/shards-verified-run.json"
            jq -e --arg sha "$(git rev-parse HEAD)" '
              .event == "push"
              and .head_branch == "main"
              and .head_sha == $sha
              and .path == ".github/workflows/publish-v0.1.3.yml"
            ' "$RUNNER_TEMP/shards-verified-run.json" >/dev/null || {
              echo "Untrusted workflow run, main branch, or source revision" >&2
              exit 1
            }
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID/jobs?per_page=100&filter=latest" \
              > "$RUNNER_TEMP/shards-verified-jobs.json"
            jq -e '
              ([.jobs[] | select(.name == "Verify v0.1.3 source and clean installed wheel" and .conclusion == "success")] | length) == 1
              and ([.jobs[] | select(.name == "Publish immutable v0.1.3 GitHub assets" and .conclusion == "success")] | length) == 1
            ' "$RUNNER_TEMP/shards-verified-jobs.json" >/dev/null || {
              echo "Verified workflow gate jobs must both have succeeded" >&2
              exit 1
            }
            echo "Authenticated release workflow run provenance and completed verification jobs"
          fi
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Release tag does not exist in the repository" >&2
            exit 1
          }
          git merge-base --is-ancestor "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" origin/main || {
            echo "Release tag is not reachable from main" >&2
            exit 1
          }
          test "$(git show "refs/tags/$RELEASE_TAG:shards_kernel/_version.py" | sed -n 's/^__version__ = "\(.*\)"/\1/p')" = "${RELEASE_TAG#v}" || {
            echo "Git tag does not match package source version" >&2
            exit 1
          }

      - name: Download only the existing release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RELEASE_TAG" = "v0.1.3" ]; then
            # The source of truth is the immutable Actions artifact produced by
            # the successful protected-main verification job, NOT checksum
            # values supplied by the caller or mutable GitHub Release assets.
            gh run download "$VERIFIED_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name shards-kernel-v0.1.3-verified \
              --dir dist
            test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
            test -f dist/shards_kernel-0.1.3-py3-none-any.whl
            test -f dist/shards_kernel-0.1.3.tar.gz
            test -f dist/SHA256SUMS
            (cd dist && sha256sum --check --strict SHA256SUMS)

            # Detect release asset replacement after the first verification:
            # compare all three public assets against the authenticated run.
            public_dir="$(mktemp -d "$RUNNER_TEMP/public-release.XXXXXX")"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --dir "$public_dir" \
              --pattern 'shards_kernel-*.whl' \
              --pattern 'shards_kernel-*.tar.gz' \
              --pattern 'SHA256SUMS'
            test "$(find "$public_dir" -maxdepth 1 -type f | wc -l)" -eq 3
            for artifact in dist/*; do
              cmp -- "$artifact" "$public_dir/$(basename "$artifact")" || {
                echo "Public release asset differs from authenticated verified run" >&2
                exit 1
              }
            done
          else
            # Historical release handling is preserved.
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --dir dist \
              --pattern 'shards_kernel-*.whl' \
              --pattern 'shards_kernel-*.tar.gz' \
              --pattern 'SHA256SUMS'
            test -f dist/SHA256SUMS
            (cd dist && sha256sum --check --strict SHA256SUMS)
          fi

      - name: Verify exact artifact set and embedded package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import re
          import tarfile
          import zipfile

          version = os.environ["RELEASE_TAG"][1:]
          directory = Path("dist")
          wheel_name = f"shards_kernel-{version}-py3-none-any.whl"
          sdist_name = f"shards_kernel-{version}.tar.gz"
          expected = {wheel_name, sdist_name, "SHA256SUMS"}
          actual = {path.name for path in directory.iterdir()}
          if actual != expected:
              raise SystemExit(f"Unexpected release artifacts: {actual ^ expected}")
          checksums = (directory / "SHA256SUMS").read_text().splitlines()
          referenced = []
          for line in checksums:
              match = re.fullmatch(r"([a-fA-F0-9]{64})  (?:\./)?([A-Za-z0-9._-]+)", line)
              if not match:
                  raise SystemExit("Malformed release checksum record")
              referenced.append(match.group(2))
          if len(referenced) != 2 or set(referenced) != {wheel_name, sdist_name}:
              raise SystemExit("Release checksums do not cover exactly the intended artifacts")
          with zipfile.ZipFile(directory / wheel_name) as wheel:
              metadata_files = [name for name in wheel.namelist()
                                if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit("Wheel metadata is missing or ambiguous")
              wheel_metadata = email.message_from_bytes(wheel.read(metadata_files[0]))
          with tarfile.open(directory / sdist_name, "r:gz") as source:
              entries = [entry for entry in source.getmembers()
                         if entry.name.endswith("/PKG-INFO") and entry.isfile()
                         and entry.name.count("/") == 1]
              if len(entries) != 1:
                  raise SystemExit("Source distribution metadata is missing or ambiguous")
              source_metadata = email.message_from_bytes(source.extractfile(entries[0]).read())
          for label, metadata in (("wheel", wheel_metadata), ("sdist", source_metadata)):
              if metadata.get("Name", "").lower().replace("_", "-") != "shards-kernel":
                  raise SystemExit(f"Unexpected {label} package name")
              if metadata.get("Version") != version:
                  raise SystemExit(f"Unexpected {label} package version")
          print(f"Verified shards-kernel=={version}, wheel and sdist")
          PY

      - name: Validate release metadata
        run: |
          python -m pip install --disable-pip-version-check "twine==7.0.0"
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Upload checked distributions for the isolated publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with OIDC
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/shards-kernel/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-pypi-distributions
          path: dist/

      - name: Publish to PyPI (trusted publishing, no API token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (pinned 2026-11-02)
