name: Cloudflare issuer pilot (no secrets)
on:
  pull_request:
    paths:
      - 'deploy/cloudflare/issuer-pilot/**'
      - 'tests/cloudflare-issuer-pilot/**'
      - '.github/workflows/issuer-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare/issuer-pilot/**'
      - 'tests/cloudflare-issuer-pilot/**'
      - '.github/workflows/issuer-pilot.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 built-in cryptography tests
        run: node --test tests/cloudflare-issuer-pilot/test_worker.mjs
      - name: Verify deployed issuer remains locked over public HTTPS
        run: |
          python - <<'PY'
          import json
          from urllib import request, error

          origin = 'https://shards-permit-issuer-pilot.ayais12210.workers.dev'
          def checked(path, method='GET'):
              req = request.Request(origin + path, method=method)
              try:
                  with request.urlopen(req, timeout=20) as response:
                      return response.status, json.load(response)
              except error.HTTPError as exc:
                  return exc.code, json.load(exc)

          code, health = checked('/health')
          assert code == 200, ('health_http', code)
          assert health['service'] == 'shards-permit-issuer-pilot'
          assert health['signing_enabled'] is False, 'Unexpectedly active signer'

          code, status = checked('/v1/status')
          assert code == 200 and status['status'] == 'LOCKED', ('status', code, status)
          assert status['signing_enabled'] is False, 'Signing credentials are active'

          code, denied = checked('/v1/issue', method='POST')
          assert code == 503, ('issue_status', code)
          assert denied['code'] == 'ISSUER_NOT_PROVISIONED', denied
          print('PASS: public HTTP health, locked status and issuance denial')
          PY
