name: Summarize new issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  summary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate offline intake summary
        run: >-
          python scripts/ci/issue_summary.py
          --event "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/shards-issue-summary.md"

      - name: Comment with deterministic summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/shards-issue-summary.md"
