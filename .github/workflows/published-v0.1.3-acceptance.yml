name: Published v0.1.3 artifact acceptance (not production certification)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-acceptance:
    name: Independent install and PostgreSQL acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: shards_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shards_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHARDS_TEST_POSTGRES_DSN: postgresql://postgres:test-only@127.0.0.1:5432/shards_acceptance
      ACCEPTANCE_TAG_COMMIT: 5f122099d37c241b5388e10ca2b2d65f74840d47
    steps:
      - name: Checkout harness and immutable release test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch exact published wheel and install into runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/wheels" 'shards-kernel==0.1.3'
          test "$(find "$RUNNER_TEMP/wheels" -type f -name '*.whl' | wc -l)" -eq 1
          python -m pip install "$RUNNER_TEMP"/wheels/*.whl 'cryptography>=43,<51' 'psycopg[binary]>=3.2,<4' 'pytest>=7,<10'
          python -m pip check

      - name: Stage tests outside repository source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse v0.1.3^{commit})" = "$ACCEPTANCE_TAG_COMMIT"
          mkdir -p "$RUNNER_TEMP/shards-acceptance"
          for name in test_distributed_postgres_accounting.py test_distributed_kernel_execution.py; do
            git show "$ACCEPTANCE_TAG_COMMIT:tests/$name" > "$RUNNER_TEMP/shards-acceptance/$name"
          done
          cp scripts/acceptance/acceptance_local.py scripts/acceptance/acceptance_postgres.py "$RUNNER_TEMP/shards-acceptance/"

      - name: Run published-wheel acceptance (no editable install)
        shell: bash
        working-directory: ${{ runner.temp }}/shards-acceptance
        run: |
          set -euo pipefail
          python -m pytest -q \
            acceptance_local.py acceptance_postgres.py \
            test_distributed_postgres_accounting.py \
            test_distributed_kernel_execution.py \
            --junitxml="$RUNNER_TEMP/acceptance-junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/acceptance-output.log"

      - name: Generate wheel-bound evidence record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acceptance/report.py --output-dir "$RUNNER_TEMP"

      - name: Upload acceptance evidence, including on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-v0.1.3-acceptance-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/acceptance.json
            ${{ runner.temp }}/acceptance-junit.xml
            ${{ runner.temp }}/acceptance-output.log
            ${{ runner.temp }}/wheels/*.whl
          retention-days: 30
