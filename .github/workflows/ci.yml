name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  e2e:
    name: Mandatory local E2E release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,crypto,mcp]"

      - name: Run strict multi-process E2E acceptance gate
        run: python scripts/ci/run_e2e_gate.py

  distributed-accounting:
    name: Cross-host PostgreSQL accounting gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: shards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHARDS_TEST_POSTGRES_DSN: postgresql://postgres:test-only@127.0.0.1:5432/shards_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -e ".[postgres,crypto]" pytest pytest-cov
      - name: Verify distributed invariants against real PostgreSQL
        run: python -m pytest tests/test_distributed_postgres_accounting.py tests/test_distributed_kernel_execution.py tests/test_distributed_authority_audit.py -q --cov=shards_kernel.distributed.postgres --cov=shards_kernel.distributed.audit_chain --cov=shards_kernel.variants.base --cov-branch --cov-report=term-missing --cov-report=xml:coverage-distributed.xml
      - name: Check whether Codecov upload is configured
        id: distributed-codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload measured PostgreSQL coverage
        if: steps.distributed-codecov-token.outputs.available == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Shards-foundation/Shards-kernel
          files: coverage-distributed.xml
          flags: distributed
          fail_ci_if_error: true

  quality:
    needs: e2e
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto]"
          pip install build

      - name: Install optional MCP SDK v2 on Python 3.11+
        if: matrix.python-version != '3.9' && matrix.python-version != '3.10'
        run: pip install -e ".[mcp]"

      - name: Verify resolved dependency consistency
        run: python -m pip check

      - name: Ruff lint
        run: ruff check . --select E,F --ignore E501

      - name: Run tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage_args=(--cov=shards_kernel --cov=implementations)
          # The runner is intentionally unsupported on 3.9/3.10. Include its
          # measured coverage only where negative-path subprocess tests run.
          if python -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
            coverage_args+=(--cov=scripts.ci.run_e2e_gate)
          fi
          pytest "${coverage_args[@]}" \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=90

      - name: Enforce exact measured coverage threshold independently
        run: |
          python - <<'PY'
          import json
          import math
          import sys

          with open("coverage.json", encoding="utf-8") as report:
              percent = float(json.load(report)["totals"]["percent_covered"])
          print(f"Unrounded branch-aware coverage: {percent:.6f}%")
          if not math.isfinite(percent) or percent < 90.0:
              print("CI hard failure: measured coverage below 90%", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify ingress trust guards under optimised Python
        run: python -O scripts/ci/verify_optimised_ingress_checkpoint.py

      - name: Governance branch coverage
        run: python scripts/ci/check_governance_coverage.py coverage.json

      - name: Check whether Codecov upload is configured
        if: matrix.python-version == '3.12'
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage report to Codecov
        if: matrix.python-version == '3.12' && steps.codecov-token.outputs.available == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Shards-foundation/Shards-kernel
          fail_ci_if_error: true

      # Only workflow-YAML-only PRs have no measurable Python patch coverage.
      # Fail closed if the comparison cannot be established; never force an
      # empty upload when source code, tests, or any other file has changed.
      - name: Classify non-coverable workflow-only PR
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        id: workflow_only
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          python - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]
          )
          paths = [os.fsdecode(path) for path in changed.split(b"\0") if path]
          only_workflow_yaml = bool(paths) and all(
              path.startswith(".github/workflows/")
              and PurePosixPath(path).suffix in {".yml", ".yaml"}
              and len(PurePosixPath(path).parts) == 3
              for path in paths
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"eligible={'true' if only_workflow_yaml else 'false'}\n")
          print("Changed paths:", paths)
          print("Workflow-only eligibility:", only_workflow_yaml)
          PY

      # The explicit file classifier above is required before force can be
      # used. Codecov may otherwise omit codecov/patch for YAML-only PRs.
      - name: Report non-coverable PR to Codecov
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && steps.codecov-token.outputs.available == 'true' && steps.workflow_only.outputs.eligible == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Shards-foundation/Shards-kernel
          run_command: empty-upload
          force: true
          fail_ci_if_error: true

      - name: Smoke checks
        run: ./scripts/smoke.sh

      - name: Run documented demos
        run: |
          python examples/01_minimal_request.py
          python examples/02_verify_evidence.py
          python examples/03_fail_closed_ambiguity.py
          python examples/04_sqlite_persistent_ledger.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Reject legacy namespace in wheel
        run: python scripts/ci/check_wheel_identity.py dist/*.whl

      - name: Verify built wheel and extras in a fresh environment
        shell: bash
        run: |
          set -euo pipefail
          wheel_venv="$RUNNER_TEMP/shards_kernel-wheel-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'shards_kernel-*.whl' -print -quit)"
          test -n "$wheel"
          wheel_extras="crypto"
          if "$wheel_venv/bin/python" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
            wheel_extras="crypto,mcp"
          fi
          "$wheel_venv/bin/python" -m pip install "$wheel[$wheel_extras]"
          "$wheel_venv/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$wheel_venv/bin/python" -c "import shards_kernel; from shards_kernel.api import StrictKernel; from implementations.storage import SQLiteAuditStorage; print('Installed wheel imports: OK')"
          "$wheel_venv/bin/shards-kernel" --version
          "$wheel_venv/bin/shards-kernel" demo --json
