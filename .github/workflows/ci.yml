name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Ruff lint
        run: ruff check . --select E,F --ignore E501

      - name: Run tests with coverage
        run: >
          pytest
          --cov=shards_kernel
          --cov=implementations
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
          --cov-fail-under=90

      - name: Governance branch coverage
        run: python scripts/ci/check_governance_coverage.py coverage.json

      - name: Check whether Codecov upload is configured
        if: matrix.python-version == '3.12'
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage report to Codecov
        if: matrix.python-version == '3.12' && steps.codecov-token.outputs.available == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Shards-foundation/Shards-kernel
          fail_ci_if_error: true

      - name: Smoke checks
        run: ./scripts/smoke.sh

      - name: Run documented demos
        run: |
          python examples/01_minimal_request.py
          python examples/02_verify_evidence.py
          python examples/03_fail_closed_ambiguity.py
          python examples/04_sqlite_persistent_ledger.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Reject legacy namespace in wheel
        run: python scripts/ci/check_wheel_identity.py dist/*.whl

      - name: Verify wheel in an isolated environment
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          wheel_venv="$RUNNER_TEMP/shards_kernel-wheel-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          "$wheel_venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_venv/bin/python" -c "import shards_kernel; from shards_kernel.api import StrictKernel; from implementations.storage import SQLiteAuditStorage; print('Installed wheel imports: OK')"
          "$wheel_venv/bin/shards-kernel" --help
