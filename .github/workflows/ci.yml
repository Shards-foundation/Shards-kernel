name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Ruff lint
        # pyproject ignores E501. Passing --select on the CLI replaces that
        # ignore, so E501 is ignored here explicitly. Import order and pyupgrade
        # findings are pre-existing and are not part of this gate.
        run: ruff check . --select E,F --ignore E501

      - name: Run tests with coverage
        run: >
          pytest
          --cov=kernels
          --cov=implementations
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
          --cov-fail-under=66

      - name: Governance branch coverage
        run: python scripts/ci/check_governance_coverage.py coverage.json

      - name: Upload coverage report to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Shards-foundation/kernels
          fail_ci_if_error: false

      - name: Smoke checks
        run: ./scripts/smoke.sh

      - name: Build package
        run: python -m build
