name: Release artifact handoff smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - '.github/workflows/artifact-handoff-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare synthetic distribution files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf 'test-only wheel bytes\n' > dist/shards_kernel-0.0.0-py3-none-any.whl
          printf 'test-only source bytes\n' > dist/shards_kernel-0.0.0.tar.gz
          sha256sum dist/*.whl dist/*.tar.gz > expected.sha256

      - name: Upload with the publishing workflow action
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Delete local files before download
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist

      - name: Download with the proposed publishing workflow action
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-pypi-distributions
          path: dist/

      - name: Verify exact artifact round trip
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict expected.sha256
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          echo 'Upload v7 to download v8 artifact handoff: PASS'
