name: Repository maintenance audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  tracked-file-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit tracked source files (read-only)
        run: python scripts/maintenance/repo_hygiene.py --repo .

  workflow-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit workflow source patterns (read-only)
        run: python scripts/maintenance/workflow_safety.py --repo .

  github-actions-observability:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Observe last 7 days of main-branch workflow health
        run: >-
          python scripts/maintenance/github_actions_watch.py
          --repo "$GITHUB_REPOSITORY"
          --branch main
          --lookback-hours 168
          --stale-minutes 240
          --max-pages 15
