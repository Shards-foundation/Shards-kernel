name: Termux Phase 3 offline issuer verification

on:
  push:
    branches:
      - feat/termux-v3-offline-issuer-20261108
  pull_request:
    branches:
      - termux-qwen3-v2-20261108
      - main
      - master

permissions:
  contents: read

jobs:
  phase3-offline-contract:
    name: Phase 3 Ed25519 issuer/verifier local contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install local contract test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[crypto]" "pytest>=7,<10" "ruff==0.17.3"

      - name: Validate offline issuer and verifier with real cryptography
        run: |
          python -m pytest -q \
            examples/termux_phase3/test_phase3.py \
            tests/test_termux_phase3_integration.py \
            tests/test_termux_phase3_tools.py

      - name: Lint Phase 3 tools, verification and smoke scripts
        run: |
          ruff check --select E,F --ignore E501 \
            examples/termux_phase3/agent_tools.py \
            examples/termux_phase3/agent_verifier_v3.py \
            examples/termux_phase3/operator_issuer.py \
            examples/termux_phase3/phase3_protocol.py \
            tests/test_termux_phase3_integration.py \
            tests/test_termux_phase3_tools.py \
            scripts/ci/smoke_termux_phase3_wheel.py \
            examples/termux_phase3/test_phase3.py

      - name: Clean-room published wheel smoke (immutable pinned v0.1.3)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          python -m venv "$temp_dir/venv"
          mkdir -p "$temp_dir/wheels" "$temp_dir/run"
          "$temp_dir/venv/bin/python" -m pip download \
            --only-binary=:all: --no-deps --dest "$temp_dir/wheels" \
            'shards-kernel==0.1.3'
          wheels=("$temp_dir"/wheels/shards_kernel-0.1.3-*.whl)
          test "${#wheels[@]}" -eq 1
          echo "baf246e771ceb559d007efafbe8ba66099bd8a65d488ca60294cae5313278df9  ${wheels[0]}" | sha256sum -c -
          "$temp_dir/venv/bin/python" -m pip install "${wheels[0]}[crypto]"
          cp examples/termux_phase3/phase3_protocol.py \
            examples/termux_phase3/agent_tools.py \
            examples/termux_phase3/agent_verifier_v3.py \
            examples/termux_phase3/operator_issuer.py \
            scripts/ci/smoke_termux_phase3_wheel.py "$temp_dir/run/"
          (cd "$temp_dir/run" && "$temp_dir/venv/bin/python" smoke_termux_phase3_wheel.py)
          # Assertions must never disappear under -O; run the same acceptance
          # with Python optimisations enabled to catch regression in this gate.
          (cd "$temp_dir/run" && "$temp_dir/venv/bin/python" -O smoke_termux_phase3_wheel.py)

      - name: Scope notice
        run: |
          echo "This contract tests two logical roles locally. It does not" >> "$GITHUB_STEP_SUMMARY"
          echo "certify physical host isolation, remote authentication, or production." >> "$GITHUB_STEP_SUMMARY"
