name: Dependency Health

on:
  pull_request:
    branches: [main, master]
    paths:
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "pyproject.toml"
      - ".github/workflows/**"
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

jobs:
  dependency-health:
    name: Dependency health (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependency tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          pip install -e .
          pip install pip-audit

      - name: Validate dependency graph
        run: pip check

      - name: Audit Shards-Kernel declared dependency graph
        # Scan this project's runtime dependency graph, not the runner's preinstalled tools.
        # The latter can contain vulnerable packages unrelated to Shards-Kernel.
        run: pip-audit .

      - name: Ensure package still imports
        run: python -c "import shards_kernel; print('shards_kernel import OK')"
