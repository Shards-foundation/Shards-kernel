[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shards-kernel"
dynamic = ["version"]
description = "Fail-closed AI agent tool authorization with signed permits, replay protection, and audit evidence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Shards Foundation Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "ai-agents",
    "agent-governance",
    "tool-authorization",
    "policy-engine",
    "signed-permits",
    "replay-protection",
    "audit-logging",
    "model-context-protocol",
    "mcp",
    "python",
]

[project.scripts]
shards-kernel = "shards_kernel.__main__:main"

[project.urls]
Repository = "https://github.com/Shards-foundation/Shards-kernel"
Documentation = "https://github.com/Shards-foundation/Shards-kernel/tree/main/docs"
Changelog = "https://github.com/Shards-foundation/Shards-kernel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Optional terminal UI: keep the default runtime dependency-free.
tui = ["textual>=8.2,<9"]
# Official MCP SDK v2 is optional and requires Python >=3.11.
# The deterministic library remains standard-library-only on Python 3.9+.
mcp = ["mcp>=2.2,<3; python_version >= '3.11'"]
crypto = ["cryptography>=43,<51"]
# Opt-in shared PostgreSQL accounting; no database connection by default.
postgres = ["psycopg[binary]>=3.2,<4"]
# Test and lint tools only. The installed runtime package has no dependencies.
dev = [
    "textual>=8.2,<9",  # Exercise the optional terminal UI on every CI Python version.
    "pytest>=7",
    "pytest-cov>=4",
    "defusedxml>=0.7.1,<1",  # Safe JUnit parsing for acceptance report tests.
    "cryptography>=43,<51",  # Optional crypto path is exercised by the full test suite.
    "hypothesis>=6",
    "ruff==0.17.3",
    # Optional adapter servers exercised by tests. Not runtime dependencies.
    # FastAPI 0.129+ requires Python >=3.10. Pip honors Requires-Python, so
    # CPython 3.9 still resolves to the newest compatible release (0.128.x).
    "flask>=2,<4",
    "fastapi>=0.100,<0.163",
    "httpx>=0.24,<1",
]

[tool.setuptools.dynamic]
version = {attr = "shards_kernel._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["shards_kernel*", "implementations*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".github/", "*.md", "*.yaml", "*.yml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
