[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shards-kernel"
dynamic = ["version"]
description = "Deterministic Control Planes for AI Systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Shards Foundation Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["kernel", "control-plane", "deterministic", "audit", "ai-systems"]

[project.scripts]
shards-kernel = "shards_kernel.__main__:main"

[project.urls]
Repository = "https://github.com/Shards-foundation/Shards-kernel"
Documentation = "https://github.com/Shards-foundation/Shards-kernel/tree/main/docs"
Changelog = "https://github.com/Shards-foundation/Shards-kernel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Test and lint tools only. The installed runtime package has no dependencies.
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff==0.17.2",
    # Optional adapter servers exercised by tests. Not runtime dependencies.
    # FastAPI 0.129+ requires Python >=3.10. Pip honors Requires-Python, so
    # CPython 3.9 still resolves to the newest compatible release (0.128.x).
    "flask>=2,<4",
    "fastapi>=0.100,<0.163",
    "httpx>=0.24,<1",
]

[tool.setuptools.dynamic]
version = {attr = "shards_kernel._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["shards_kernel*", "implementations*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".github/", "*.md", "*.yaml", "*.yml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
