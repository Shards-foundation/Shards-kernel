site_name: Shards-Kernel
site_description: Deterministic control planes and CI/CD governance documentation.
repo_url: https://github.com/Shards-foundation/Shards-kernel
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.action.edit

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Product tour: PRODUCT_TOUR.md
  - Architecture: ARCHITECTURE.md
  - Threat Model: THREAT_MODEL.md
  - Demos: DEMOS.md
  - Pipelines:
      - Phases: pipelines/PHASES.md
      - Gates: pipelines/GATES.md
      - HPC CI/CD Architecture: pipelines/HPC_CICD_ARCHITECTURE.md
